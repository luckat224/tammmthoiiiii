<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HỌC TẬP PHÁP LUẬT 2026</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800;900&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Be Vietnam Pro', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #0a0f1d;
            min-height: 100vh;
            color: #ffffff;
            overflow-x: hidden;
        }

        /* 🌟 WELCOME SELECTION HUB (3 NÚT DUY NHẤT CHUẨN TOÁN 7) */
        .welcome-screen {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: radial-gradient(circle at 50% 50%, #1e293b 0%, #0a0f1d 100%);
        }

        .welcome-container-minimal {
            max-width: 900px;
            width: 100%;
            margin: 0 auto;
        }

        .subject-grid-minimal {
            display: flex;
            flex-direction: column;
            gap: 24px;
            max-width: 650px;
            margin: 0 auto;
        }

        .minimal-hub-card {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            padding: 28px 36px;
            border-radius: 20px;
            border: 2px solid #334155;
            background: #1e293b;
            color: #ffffff;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            outline: none;
            text-decoration: none;
        }

        .minimal-hub-card .hub-icon {
            font-size: 38px;
            line-height: 1;
        }

        .minimal-hub-card .hub-title {
            font-size: 26px;
            font-weight: 900;
            letter-spacing: 1px;
            text-align: center;
        }

        /* Hover States Chuẩn 3 Màu Đặc Trưng */
        .minimal-hub-card.card-vol1:hover {
            background: linear-gradient(135deg, #0284c7, #0369a1);
            border-color: #38bdf8;
            box-shadow: 0 15px 35px rgba(2, 132, 199, 0.45);
            transform: translateY(-3px);
        }

        .minimal-hub-card.card-vol2:hover {
            background: linear-gradient(135deg, #10b981, #059669);
            border-color: #34d399;
            box-shadow: 0 15px 35px rgba(16, 185, 129, 0.45);
            transform: translateY(-3px);
        }

        .minimal-hub-card.card-vol3:hover {
            background: linear-gradient(135deg, #8b5cf6, #6d28d9);
            border-color: #a78bfa;
            box-shadow: 0 15px 35px rgba(139, 92, 246, 0.45);
            transform: translateY(-3px);
        }

        @media (max-width: 600px) {
            .minimal-hub-card {
                padding: 22px 24px;
                gap: 16px;
            }
            .minimal-hub-card .hub-icon {
                font-size: 32px;
            }
            .minimal-hub-card .hub-title {
                font-size: 20px;
                letter-spacing: 0.5px;
            }
        }
    </style>
</head>
<body>

    <!-- 🌟 WELCOME SELECTION HUB (3 NÚT DUY NHẤT) -->
    <div id="welcome-screen" class="welcome-screen">
        <div class="welcome-container-minimal">
            <div class="subject-grid-minimal">
                <!-- Nút 1: LUẬT CẠNH TRANH 2018 -->
                <a href="LCT/index.html" class="minimal-hub-card card-vol1">
                    <span class="hub-icon">⚖️</span>
                    <span class="hub-title">LUẬT CẠNH TRANH 2018</span>
                </a>

                <!-- Nút 2: LUẬT KINH DOANH BẢO HIỂM -->
                <a href="LKDBH/index.html" class="minimal-hub-card card-vol2">
                    <span class="hub-icon">🛡️</span>
                    <span class="hub-title">LUẬT KINH DOANH BẢO HIỂM</span>
                </a>

                <!-- Nút 3: LUẬT DÂN SỰ & TỐ TỤNG DÂN SỰ -->
                <a href="LDS&TTDS/index.html" class="minimal-hub-card card-vol3">
                    <span class="hub-icon">🏛️</span>
                    <span class="hub-title">LUẬT DÂN SỰ & TỐ TỤNG DÂN SỰ</span>
                </a>
            </div>
        </div>
    </div>

</body>
</html>
